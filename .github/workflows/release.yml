# Builds the Windows installer and publishes it to this repository's GitHub Releases.
# The website deploys from this repository via site.yml.
name: release
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 4 * * 1'   # weekly rebuild so shipped channel data stays fresh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run data
      - run: npx vite build
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ github.token }}
